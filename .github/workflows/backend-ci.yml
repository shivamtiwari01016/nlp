name: Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: support_ticket_triage_test
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ENVIRONMENT: testing
      DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/support_ticket_triage_test
      MYSQL_TEST_DATABASE_URL: mysql+pymysql://root:ci-root-password@127.0.0.1:3306/support_ticket_triage_test
      TICKET_TRIAGE_CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m spacy download en_core_web_sm
      - run: python -m alembic upgrade head
      - run: python -m ruff check src tests
      - run: python -m pytest -q
